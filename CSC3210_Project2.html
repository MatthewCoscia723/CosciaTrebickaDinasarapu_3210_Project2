<html>
<head>
    <title>CSC 3210 Solar Satellite Satisfaction</title>
</head>
<body>
    
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">

// 1. Initialize the Scene
const scene = new THREE.Scene();

// 2. Configure the Camera (Perspective Projection)
// Arguments: Field of View (deg), Aspect Ratio, Near Clipping Plane, Far Clipping Plane
const camera = new THREE.PerspectiveCamera(
  60, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);
camera.position.set(0, 25, 40); // Position the camera above and behind the terrain angled down
camera.lookAt(new THREE.Vector3(0, 0, 0));
scene.add(camera);

// Vertex shader that displaces terrain heights over time and applies the Model View Projection pipeline
const terrainVertexShader = `
  // Uniforms
  uniform float uTime;
  uniform float uAmplitude;

  // Normalized height passed to the fragment shader
  varying float vHeight;

  void main() {
    // Copies the original vertex position so it can be displaced
    vec3 displacedPosition = position;

    // Large, slow wave travelling along the x axis
    float waveA = sin(position.x * 0.3 + uTime * 1.0);
    // Medium wave travelling along the z axis at a different speed
    float waveB = cos(position.z * 0.25 + uTime * 0.8);
    // Small, fast wave travelling along the diagonal between the x and z axes
    float waveC = 0.5 * sin((position.x + position.z) * 0.6 + uTime * 1.7);

    // Combines the waves and scales them so the tallest possible peak equals uAmplitude
    displacedPosition.y += uAmplitude * (waveA + waveB + waveC) / 2.5;

    // Normalizes the height to -1.0 to 1.0 range so colors stay consistent
    vHeight = displacedPosition.y / uAmplitude;

    // Equivalent to V * M * v
    vec4 modelViewPosition = modelViewMatrix * vec4(displacedPosition, 1.0);

    gl_Position = projectionMatrix * modelViewPosition;
  }
`;

// Fragment shader that colors the terrain based on its height 
const terrainFragmentShader = `
  // Normalized height received from the vertex shader
  varying float vHeight;

  void main() {
    // Converts the height from the -1.0 to 1.0 range into the 0.0 to 1.0 range
    float t = vHeight * 0.5 + 0.5;

    // Colors for each elevation section
    // The ideas for the colors are based on the real world and what kinds of colors represent different elevations
    vec3 deepWater = vec3(0.05, 0.15, 0.4);
    vec3 shallowWater = vec3(0.1, 0.5, 0.7);
    vec3 grass = vec3(0.2, 0.6, 0.25);
    vec3 rock = vec3(0.45, 0.4, 0.35);
    vec3 snow = vec3(0.95, 0.95, 0.95);

    // Blends from one band to the next as the height rises
    vec3 color = mix(deepWater, shallowWater, smoothstep(0.0, 0.35, t));
    color = mix(color, grass, smoothstep(0.35, 0.45, t));
    color = mix(color, rock, smoothstep(0.6, 0.75, t));
    color = mix(color, snow, smoothstep(0.82, 0.92, t));

    gl_FragColor = vec4(color, 1.0);
  }
`;

// Constants representing the size of the terrain and how densely the terrain is segmented
const terrainSize = 40;
const terrainSegments = 150;

// Function that creates the terrain mesh as a finely subdivided plane that is laid flat
function createTerrain() {
  const geometry = new THREE.PlaneGeometry(terrainSize, terrainSize, terrainSegments, terrainSegments);

  // Rotates the plane's vertices from standing upright to lying flat
  geometry.rotateX(-Math.PI / 2);

  // Custom shader material that displaces the terrain using time-based uniforms
  const material = new THREE.ShaderMaterial({
    vertexShader: terrainVertexShader,
    fragmentShader: terrainFragmentShader,
    uniforms: {
      uTime: {value: 0.0},
      uAmplitude: {value: 1.5}
    },
    wireframe: false
  });

  return new THREE.Mesh(geometry, material);
}

// Creates instance of the terrain mesh and adds it to the scene
const terrain = createTerrain();
scene.add(terrain);

// Satellite body creation
const satellite = new THREE.Group();

// Main satellite body
const bodyGeometry = new THREE.BoxGeometry(2,1,2);
const bodyMaterial = new THREE.MeshBasicMaterial({color: 0xaaaaaa})
const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
satellite.add(body);

// Panel material and geometry
const panelGeometry = new THREE.BoxGeometry(3, 0.1, 1.5);
const panelMaterial = new THREE.MeshBasicMaterial({color: 0x222222});

// Left solar panel
const leftPanel = new THREE.Mesh(panelGeometry, panelMaterial);
leftPanel.position.x = -2.5;
satellite.add(leftPanel);

// Right solar panel
const rightPanel = new THREE.Mesh(panelGeometry, panelMaterial);
rightPanel.position.x = 2.5;
satellite.add(rightPanel);

satellite.position.y = 8;
scene.add(satellite)

// Satellite orbit configuration
let orbitAngle = 0;
const orbitRadius = 25;
const orbitSpeed = 0.5;

// Solar panel rotation configuration
let solarPanelAngle = 0;
let solarPanelSpeed = 1;

// 4. Initialize the WebGL Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Clock that tracks real world time between frames
const clock = new THREE.Clock();

// Renders the frame continuously and updates time-based animation
function animate() {
  requestAnimationFrame(animate);

  // Time in seconds since the last frame, used for movement that is independent of frame rate
  const deltaTime = clock.getDelta();

  // Sends the total elapsed time to the terrain shader
  terrain.material.uniforms.uTime.value = clock.elapsedTime;

  // Update the satellite orbit
  orbitAngle += orbitSpeed * deltaTime;
  satellite.position.x = Math.cos(orbitAngle) * orbitRadius;
  satellite.position.y = Math.sin(orbitAngle) * orbitRadius - 5; // -5 for the offset of satellite flying off screen

  // Make the satellite always look at the center of the terrain
  satellite.lookAt(0, 0, 0);
  
  // Update the solar panel rotation
  solarPanelAngle += solarPanelSpeed * deltaTime;
  leftPanel.rotation.x = solarPanelAngle;
  rightPanel.rotation.x = solarPanelAngle;

  renderer.render(scene, camera);
}

animate();
    </script>
</body>
</html>
