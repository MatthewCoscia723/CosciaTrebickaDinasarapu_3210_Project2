<html>
<head>
    <title>CSC 3210 Solar Satellite Satisfaction</title>
</head>
<body>
    
  <!-- Three.js Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">

// 1. Initialize the Scene
const scene = new THREE.Scene();

// 2. Configure the Camera (Perspective Projection)
// Arguments: Field of View (deg), Aspect Ratio, Near Clipping Plane, Far Clipping Plane
const camera = new THREE.PerspectiveCamera(
  60, 
  window.innerWidth / window.innerHeight, 
  0.1, 
  1000
);

const orthographicCamera = new THREE.OrthographicCamera(
  -25,   // Left
  25,    // Right
  25,    // Top
  -25,   // Bottom
  0.1,   // Near
  1000   // Far
);
orthographicCamera.position.set(0, 50, 0);
orthographicCamera.lookAt(0, 0, 0);

// Camera currently being used
let activeCamera = camera;

// Perspective camera mouse viewing
let yaw = 0;
let pitch = 0;

const mouseSensitivity = 0.002;
const pitchLimit = Math.PI / 2 - 0.1;

camera.position.set(0, 25, 40); // Position the camera above and behind the terrain angled down
camera.lookAt(new THREE.Vector3(0, 0, 0));
const target = new THREE.Vector3(0, 0, 0);
const initialDirection = target.clone().sub(camera.position).normalize();

pitch = Math.asin(initialDirection.y);
yaw = Math.atan2(initialDirection.x, -initialDirection.z);

scene.add(camera);

// Vertex shader that displaces terrain heights over time and applies the Model View Projection pipeline
const terrainVertexShader = `
  // Uniforms
  uniform float uTime;
  uniform float uAmplitude;

  // Normalized height passed to the fragment shader
  varying float vHeight;

  // Position of the satellite
  uniform vec3 uSatellitePosition;
  // How far from the point under the satellite the highlight reaches
  uniform float uHighlightRadius;

  // Strength of the highlight passed to the fragment shader
  varying float vHighlight;

  void main() {
    // Copies the original vertex position so it can be displaced
    vec3 displacedPosition = position;

    // Large, slow wave travelling along the x axis
    float waveA = sin(position.x * 0.3 + uTime * 1.0);
    // Medium wave travelling along the z axis at a different speed
    float waveB = cos(position.z * 0.25 + uTime * 0.8);
    // Small, fast wave travelling along the diagonal between the x and z axes
    float waveC = 0.5 * sin((position.x + position.z) * 0.6 + uTime * 1.7);

    // Combines the waves and scales them so the tallest possible peak equals uAmplitude
    displacedPosition.y += uAmplitude * (waveA + waveB + waveC) / 2.5;

    // Normalizes the height to -1.0 to 1.0 range so colors stay consistent
    vHeight = displacedPosition.y / uAmplitude;

    // Horizontal distance from this vertex to the point directly below the satellite
    float distanceToSatellite = distance(position.xz, uSatellitePosition.xz);
    // Strength of the highlight
    float highlight = 1.0 - smoothstep(uHighlightRadius * 0.5, uHighlightRadius, distanceToSatellite);

    // Fades the highlight out when the satellite dips below the terrain
    highlight *= smoothstep(0.0, 2.0, uSatellitePosition.y);

    // Scales up the terrain under the satellite, up to 2.5 times its normal height
    displacedPosition.y *= 1.0 + highlight * 1.5;
    // Lifts up the highlighted area so it rises clearly above the surrounding terrain
    displacedPosition.y += highlight * 2.0;

    // Passes the highlight strength to the fragment shader
    vHighlight = highlight;

    // Equivalent to V * M * v
    vec4 modelViewPosition = modelViewMatrix * vec4(displacedPosition, 1.0);

    gl_Position = projectionMatrix * modelViewPosition;
  }
`;

// Fragment shader that colors the terrain based on its height and tints the area beneath the satellite
const terrainFragmentShader = `
  // Normalized height received from the vertex shader
  varying float vHeight;

  // Strength of the highlight received from the vertex shader
  varying float vHighlight;

  void main() {
    // Converts the height from the -1.0 to 1.0 range into the 0.0 to 1.0 range
    float t = vHeight * 0.5 + 0.5;

    // Colors for each elevation section
    // The ideas for the colors are based on the real world and what kinds of colors represent different elevations
    vec3 deepWater = vec3(0.05, 0.15, 0.4);
    vec3 shallowWater = vec3(0.1, 0.5, 0.7);
    vec3 grass = vec3(0.2, 0.6, 0.25);
    vec3 rock = vec3(0.45, 0.4, 0.35);
    vec3 snow = vec3(0.95, 0.95, 0.95);

    // Blends from one band to the next as the height rises
    vec3 color = mix(deepWater, shallowWater, smoothstep(0.0, 0.35, t));
    color = mix(color, grass, smoothstep(0.35, 0.45, t));
    color = mix(color, rock, smoothstep(0.6, 0.75, t));
    color = mix(color, snow, smoothstep(0.82, 0.92, t));

    // Warm orange color used to highlight the terrain beneath the satellite
    vec3 highlightColor = vec3(1.0, 0.55, 0.1);
    // Blends the highlight color over the terrain color based on the highlight strength
    color = mix(color, highlightColor, vHighlight * 0.6);

    gl_FragColor = vec4(color, 1.0);
  }
`;

// Constants representing the size of the terrain and how densely the terrain is segmented
const terrainSize = 40;
const terrainSegments = 150;

// Function that creates the terrain mesh as a finely subdivided plane that is laid flat
function createTerrain() {
  const geometry = new THREE.PlaneGeometry(terrainSize, terrainSize, terrainSegments, terrainSegments);

  // Rotates the plane's vertices from standing upright to lying flat
  geometry.rotateX(-Math.PI / 2);

  // Custom shader material that displaces and colors the terrain using time and satellite position uniforms
  const material = new THREE.ShaderMaterial({
    vertexShader: terrainVertexShader,
    fragmentShader: terrainFragmentShader,
    uniforms: {
      uTime: {value: 0.0},
      uAmplitude: {value: 1.5},
      uSatellitePosition: {value: new THREE.Vector3()},
      uHighlightRadius: {value: 5.0}
    },
    wireframe: false
  });

  return new THREE.Mesh(geometry, material);
}

// Creates instance of the terrain mesh and adds it to the scene
const terrain = createTerrain();
scene.add(terrain);

// Satellite body creation
const satellite = new THREE.Group();

// Main satellite body
const bodyGeometry = new THREE.BoxGeometry(2,1,2);
const bodyMaterial = new THREE.MeshBasicMaterial({color: 0x555555})
const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
satellite.add(body);

// Rods connecting the body and the panels
const rodGeometry = new THREE.CylinderGeometry(0.05, 0.05, 2.5, 8);
const rodMaterial = new THREE.MeshBasicMaterial({color: 0x888888});

// Creating the left solar panel rod
const leftRod = new THREE.Mesh(rodGeometry, rodMaterial);
leftRod.rotation.z = Math.PI / 2; // Defaults as vertical so must be rotated
leftRod.position.x = -1.75; //Midpoint between the left solar panel and the satellite
leftRod.position.y = 0;
leftRod.position.z = 0;
satellite.add(leftRod);

// Creating the right solar panel rod
const rightRod = new THREE.Mesh(rodGeometry, rodMaterial);
rightRod.rotation.z = Math.PI / 2; // Defaults as vertical so must be rotated
rightRod.position.x = 1.75;
rightRod.position.y = 0;
rightRod.position.z = 0;
satellite.add(rightRod);

// Panel material and geometry
const panelGeometry = new THREE.BoxGeometry(3, 0.1, 1.5);
const panelMaterial = new THREE.MeshBasicMaterial({color: 0x1d1d77});

// Left solar panel
const leftPanel = new THREE.Mesh(panelGeometry, panelMaterial);
leftPanel.position.x = -3.5;
satellite.add(leftPanel);

// Right solar panel
const rightPanel = new THREE.Mesh(panelGeometry, panelMaterial);
rightPanel.position.x = 3.5;
satellite.add(rightPanel);

// Viewing face for satellite (where it's facing)
const sphereGeometry = new THREE.SphereGeometry(0.3, 16, 16);
const sphereMaterial = new THREE.MeshBasicMaterial({color: 0xdddddd});
const frontSphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
frontSphere.position.z = 1.2;
satellite.add(frontSphere);

satellite.position.y = 8;
scene.add(satellite)

// Satellite particles
const particleGeometry = new THREE.BufferGeometry();
const particleCount = 50;
// Arrays to hold the particle positions and velocities
const particlePositions = [];
const particleVelocities = [];

// Initialize the particles at the origin with 0 velocity
for (let i = 0; i < particleCount; i++)
{
  particlePositions.push(0, 0, 0);
  particleVelocities.push(0, 0, 0);
}

particleGeometry.setAttribute("position", new THREE.Float32BufferAttribute(particlePositions, 3));

// Customize the particle color and material
const particleMaterial = new THREE.PointsMaterial({color: 0xffa500, size: 0.15});
const thrusterParticles = new THREE.Points(particleGeometry, particleMaterial);
scene.add(thrusterParticles)

// Satellite orbit configuration
let orbitAngle = 0;
const orbitRadius = terrainSize / 2;
const orbitSpeed = 0.5;

// Solar panel rotation configuration
let solarPanelAngle = 0;
let solarPanelSpeed = 1;

// 4. Initialize the WebGL Renderer
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setClearColor(0x111111, 1.0); // Dark grey background
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Perspective camera movement controls
let moveForward = false;
let moveBackward = false;
let moveLeft = false;
let moveRight = false;

const cameraSpeed = 10;

// Switch between perspective and orthographic cameras
document.addEventListener('keydown', function(event) {
  switch(event.key) {
    case '1':
      activeCamera = camera;
      break;

    case '2':
      activeCamera = orthographicCamera;
      break;
    
    case "w":
      moveForward = true;
      break;

    case "s":
      moveBackward = true;
      break;

    case "a":
      moveLeft = true;
      break;

    case "d":
      moveRight = true;
      break;
  }
});

// Stop camera movement when a movement key is released
document.addEventListener('keyup', function(event) {
  switch(event.key) {
    case "w":
      moveForward = false;
      break;
    
    case "s":
      moveBackward = false;
      break;

    case "a":
      moveLeft = false;
      break;

    case "d":
      moveRight = false;
      break;
  }
});

document.addEventListener('mousemove', function(event) {
  if (activeCamera === camera) {
    yaw += event.movementX * mouseSensitivity;
    pitch -= event.movementY * mouseSensitivity;

    // Limit the pitch to prevent flipping
    pitch = Math.max(-pitchLimit, Math.min(pitchLimit, pitch));
    const direction = new THREE.Vector3(
      Math.sin(yaw) * Math.cos(pitch),
      Math.sin(pitch),
      -Math.cos(yaw) * Math.cos(pitch)
    );

    const lookAtPoint = camera.position.clone().add(direction);
    camera.lookAt(lookAtPoint);
  }
});

window.addEventListener('resize', function() {
  const aspect = window.innerWidth / window.innerHeight;

  camera.aspect = aspect;
  camera.updateProjectionMatrix();

  renderer.setSize(window.innerWidth, window.innerHeight);

  orthographicCamera.left = -25 * aspect;
  orthographicCamera.right = 25 * aspect;
  orthographicCamera.top = 25;
  orthographicCamera.bottom = -25;

  orthographicCamera.updateProjectionMatrix();
});

// Clock that tracks real world time between frames
const clock = new THREE.Clock();

// Renders the frame continuously and updates time-based animation
function animate() {
  requestAnimationFrame(animate);

  // Time in seconds since the last frame, used for movement that is independent of frame rate
  const deltaTime = clock.getDelta();

  if (activeCamera === camera) {
    
    const forward = new THREE.Vector3();
    camera.getWorldDirection(forward);
    forward.y = 0;
    forward.normalize();
    
    const right = new THREE.Vector3(-forward.z, 0, forward.x);
    if (moveForward) {
      camera.position.addScaledVector(forward, cameraSpeed * deltaTime);
    }
    if (moveBackward) {
      camera.position.addScaledVector(forward, -cameraSpeed * deltaTime);
    }
    if (moveLeft) {
      camera.position.addScaledVector(right, -cameraSpeed * deltaTime);
    }
    if (moveRight) {
      camera.position.addScaledVector(right, cameraSpeed * deltaTime);
    }
  }

  // Sends the total elapsed time to the terrain shader
  terrain.material.uniforms.uTime.value = clock.elapsedTime;

  // Update the satellite orbit
  orbitAngle += orbitSpeed * deltaTime;
  satellite.position.x = Math.cos(orbitAngle) * orbitRadius;
  satellite.position.y = Math.sin(orbitAngle) * orbitRadius - 5; // -5 for the offset of satellite flying off screen

  satellite.lookAt(0,0,0);

  // Update the highlight position for the terrain shader
  terrain.material.uniforms.uSatellitePosition.value.copy(satellite.position);

  // Update the solar panel rotation
  solarPanelAngle += solarPanelSpeed * deltaTime;
  leftPanel.rotation.x = solarPanelAngle;
  rightPanel.rotation.x = solarPanelAngle;

  // Compute the tangent direction (derivatives) of the x,y satellite components, then negate them (because thrust is backwards of satellite trajectory)
  let thrustX = Math.sin(orbitAngle); // x = cos(angle), so dx = -sin(angle), meaning thrust = sin(angle)
  let thrustY = -Math.cos(orbitAngle); // y = sin(angle) so dy = cos(angle), meaning thrust = cos(angle)

  // Array of all particles x,y,z positions
  const pos = thrusterParticles.geometry.attributes.position.array;

  
  // Update each particles position
  for (let i = 0; i < particleCount; i++)
  {
    // Put particles at the satellite after initializing them at origin
    if (particleVelocities[i*3] === 0 && particleVelocities[i*3+1] === 0)
    {
      pos[i*3] = satellite.position.x;
      pos[i*3+1] = satellite.position.y;
      pos[i*3+2] = satellite.position.z;

      // Assign each particle their velocity plus some randomness (to make it more realistic)
      particleVelocities[i*3] = thrustX * (1 + Math.random()*0.5);
      particleVelocities[i*3+1] = thrustY * (1 + Math.random()*0.5);
      particleVelocities[i*3 + 2] = (Math.random() - 0.5) * 0.2;
    }

    // Alter positions of the particles using the particle velocities and deltaTime
    pos[i*3] += particleVelocities[i*3] * deltaTime * 8;
    pos[i*3 + 1] += particleVelocities[i*3 + 1] * deltaTime * 8;
    pos[i*3 + 2] += particleVelocities[i*3 + 2] * deltaTime * 8;

    // If the particle is too far from the satellite, reset the particle.
    if (Math.abs(pos[i*3] - satellite.position.x) > 5 || Math.abs(pos[i*3+1] - satellite.position.y) > 5)
    {
      particleVelocities[i*3] = 0;
      particleVelocities[i*3+1] = 0;
      particleVelocities[i*3+2] = 0;
    }
  }
  // Continuously update the particles positions
  thrusterParticles.geometry.attributes.position.needsUpdate = true;
  renderer.render(scene, activeCamera);
}

animate();
    </script>
</body>
</html>
